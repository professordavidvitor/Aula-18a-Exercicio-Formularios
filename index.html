<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Test Drive - BYD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Reserva de Test Drive - BYD</h1>

  <form action="/reservar" method="post" autocomplete="on">

    <fieldset>
      <legend>Informações Pessoais</legend>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required minlength="3" maxlength="100">

      <label for="email">E-mail para contato:</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

      <label for="telefone">Telefone (WhatsApp):</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(11)91234-5678" required pattern="^\\(\\d{2}\\)\\d{4,5}-\\d{4}$">

      <label for="cidade">Cidade onde deseja realizar o test drive:</label>
      <input type="text" id="cidade" name="cidade" placeholder="Ex: Brasília, São Paulo..." required>

      <label for="cnh">Envie uma foto da sua CNH válida:</label>
      <input type="file" id="cnh" name="cnh" accept="image/*" required>
    </fieldset>

    <fieldset>
      <legend>Detalhes da Reserva</legend>

      <label for="modelo">Modelo que deseja testar:</label>
      <select id="modelo" name="modelo" required>
        <option value="">--Selecione o modelo--</option>
        <option value="Seal">BYD Seal</option>
        <option value="Song Plus">BYD Song Plus</option>
        <option value="Dolphin">BYD Dolphin</option>
        <option value="Yuan Plus">BYD Yuan Plus</option>
      </select>

      <label for="data">Data desejada para o test drive:</label>
      <input type="date" id="data" name="data" required>

      <label for="hora">Horário preferencial:</label>
      <input type="time" id="hora" name="hora" required>

      <label for="concessionaria">Concessionária de preferência:</label>
      <select id="concessionaria" name="concessionaria" required>
        <option value="">--Selecione uma opção--</option>
        <option value="asa-norte">BYD Asa Norte</option>
        <option value="taguatinga">BYD Taguatinga</option>
        <option value="aguas-claras">BYD Águas Claras</option>
        <option value="outra">Outra (informar no campo de observações)</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Preferências do Test Drive</legend>

      <label>Qual tipo de trajeto você gostaria de testar?</label>
      <div class="opcoes">
        <label><input type="radio" name="trajeto" value="urbano" required> Urbano</label>
        <label><input type="radio" name="trajeto" value="estrada"> Estrada</label>
        <label><input type="radio" name="trajeto" value="misto"> Misto (cidade + estrada)</label>
      </div>

      <label>Itens que mais chamam sua atenção:</label>
      <div class="opcoes">
        <label><input type="checkbox" name="interesse" value="autonomia"> Autonomia</label>
        <label><input type="checkbox" name="interesse" value="conforto"> Conforto</label>
        <label><input type="checkbox" name="interesse" value="tecnologia"> Tecnologia</label>
        <label><input type="checkbox" name="interesse" value="design"> Design</label>
      </div>

      <label for="corPreferida">Cor preferida para o carro:</label>
      <input type="color" id="corPreferida" name="corPreferida" value="#000000">
    </fieldset>

    <fieldset>
      <legend>Feedback e Expectativas</legend>

      <label for="expectativa">O que você espera do seu test drive BYD?</label>
      <textarea id="expectativa" name="expectativa" rows="5" placeholder="Exemplo: Quero sentir a potência, o conforto e a dirigibilidade dos modelos elétricos."></textarea>

      <label for="avaliacaoInteresse">De 0 a 5, qual é seu nível de interesse em adquirir um BYD?</label>
      <input type="range" id="avaliacaoInteresse" name="avaliacaoInteresse" min="0" max="5" step="1">
    </fieldset>

    <div class="buttons">
      <input type="submit" value="Reservar Test Drive">
      <input type="reset" value="Limpar Formulário">
    </div>

  </form>

</body>
</html>
